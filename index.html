<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bike Nav Pro</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.css" />

    <style>
        :root { --bg: #111; --card: #1a1a1a; --accent: #00e676; --blue: #2979ff; --error: #ff5252; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
        
        /* Layout */
        #map { height: 55vh; width: 100%; background: #222; } 
        #display-area { height: 45vh; width: 100%; background: var(--bg); position: relative; border-top: 1px solid #333; }
        
        /* Views */
        #elevation-div { height: 100%; width: 100%; }
        #text-summary-view { 
            height: 100%; width: 100%; 
            display: none; /* Hidden by default */
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        /* Stat Card Formatting */
        .summary-card {
            background: var(--card);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            border-bottom: 3px solid #333;
        }
        .summary-label { display: block; font-size: 0.7rem; color: #888; text-transform: uppercase; margin-bottom: 4px; }
        .summary-value { display: block; font-size: 1.2rem; font-weight: bold; color: var(--accent); }

        /* Floating Controls */
        #controls {
            position: absolute; bottom: 47vh; right: 12px; z-index: 1000;
            display: flex; flex-direction: column; gap: 10px;
        }
        .btn {
            width: 50px; height: 50px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            background: #333; color: white;
        }
        #toggleViewBtn { background: var(--blue); }
        #startBtn { background: var(--accent); color: black; }
        #stopBtn { background: var(--error); display: none; }
        #locateBtn { background: white; color: black; }

        /* Current Speed Overlay */
        #live-stats {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            display: flex; gap: 5px; pointer-events: none;
        }
        .live-card { background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 8px; border-left: 3px solid var(--accent); }
        
        /* Hide the default messy plugin text */
        .elevation-summary { display: none !important; }
    </style>
</head>
<body>

    <div id="live-stats">
        <div class="live-card"><span id="speed" style="font-weight:bold; color:var(--accent);">0.0</span> <small>km/h</small></div>
    </div>

    <div id="controls">
        <label class="btn">📂<input type="file" id="fileInput" style="display:none" accept=".gpx"></label>
        <button class="btn" id="toggleViewBtn">📊</button>
        <button class="btn" id="locateBtn">🎯</button>
        <button class="btn" id="startBtn">▶️</button>
        <button class="btn" id="stopBtn">⏹️</button>
    </div>

    <div id="map"></div>
    
    <div id="display-area">
        <!-- View 1: The Graph -->
        <div id="elevation-div"></div>
        
        <!-- View 2: The Formatted Text -->
        <div id="text-summary-view">
            <div class="summary-card"><span class="summary-label">Distance</span><span id="txt-dist" class="summary-value">0.0 km</span></div>
            <div class="summary-card"><span class="summary-label">Time</span><span id="txt-time" class="summary-value">00:00:00</span></div>
            <div class="summary-card"><span class="summary-label">Ascent</span><span id="txt-ascent" class="summary-value">0 m</span></div>
            <div class="summary-card"><span class="summary-label">Max Elev</span><span id="txt-max" class="summary-value">0 m</span></div>
            <div class="summary-card"><span class="summary-label">Avg Elev</span><span id="txt-avg" class="summary-value">0 m</span></div>
            <div class="summary-card"><span class="summary-label">Incline</span><span id="txt-grade" class="summary-value">0 %</span></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-gpx/gpx.js"></script>
    <script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>
    <script src="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.js"></script>

    <script>
        let map, elControl, userMarker, watchId, polyline, recordedPoints = [];
        let isRecording = false, followMode = true, currentLatlng = null;

        // 1. Setup Map
        map = L.map('map', { zoomControl: false, attributionControl: false }).setView([0,0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // 2. Setup Elevation
        elControl = L.control.elevation({
            container: "#elevation-div",
            theme: "dark-theme",
            detached: true,
            elevationData: "ele",
            summary: false, // We use our custom summary instead
        }).addTo(map);

        // 3. Toggle View Logic (Graph vs Text)
        let graphVisible = true;
        document.getElementById('toggleViewBtn').onclick = () => {
            graphVisible = !graphVisible;
            document.getElementById('elevation-div').style.display = graphVisible ? 'block' : 'none';
            document.getElementById('text-summary-view').style.display = graphVisible ? 'none' : 'grid';
            document.getElementById('toggleViewBtn').innerText = graphVisible ? '📊' : '📝';
        };

        // 4. GPS and Center Logic
        function initGPS() {
            watchId = navigator.geolocation.watchPosition(pos => {
                const { latitude, longitude, altitude, speed, heading } = pos.coords;
                currentLatlng = [latitude, longitude];
                
                document.getElementById('speed').innerText = (speed * 3.6 || 0).toFixed(1);

                if (!userMarker) {
                    userMarker = L.circleMarker(currentLatlng, {radius: 10, color: 'white', fillColor: '#2979ff', fillOpacity: 1, weight: 3}).addTo(map);
                    map.setView(currentLatlng, 17);
                } else {
                    userMarker.setLatLng(currentLatlng);
                }

                // STAY IN MIDDLE logic
                if (followMode) {
                    map.panTo(currentLatlng);
                }

                if (isRecording) {
                    recordedPoints.push({ lat: latitude, lon: longitude, ele: altitude || 0, time: new Date().toISOString() });
                    polyline.addLatLng(currentLatlng);
                    updateDashboardInfo();
                }
            }, null, { enableHighAccuracy: true });
        }

        // Center Button
        document.getElementById('locateBtn').onclick = () => {
            followMode = true;
            document.getElementById('locateBtn').style.background = "var(--blue)";
            document.getElementById('locateBtn').style.color = "white";
            if (currentLatlng) map.flyTo(currentLatlng, 17);
        };

        // If user drags map, disable "Stay in Middle" auto-follow
        map.on('dragstart', () => {
            followMode = false;
            document.getElementById('locateBtn').style.background = "white";
            document.getElementById('locateBtn').style.color = "black";
        });

        // 5. Start/Stop Recording
        document.getElementById('startBtn').onclick = () => {
            isRecording = true; recordedPoints = [];
            if(polyline) map.removeLayer(polyline);
            polyline = L.polyline([], {color: 'var(--accent)', weight: 6}).addTo(map);
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'flex';
        };

        document.getElementById('stopBtn').onclick = () => {
            if(confirm("Stop and save ride?")) {
                isRecording = false;
                document.getElementById('startBtn').style.display = 'flex';
                document.getElementById('stopBtn').style.display = 'none';
                saveGPX();
            }
        };

        // 6. Update Dashboard Text
        function updateDashboardInfo() {
            // This pulls data from the elevation plugin stats or custom calc
            const stats = elControl.getTrackStats(); // If available in plugin version
            if (stats) {
                document.getElementById('txt-dist').innerText = (stats.dist / 1000).toFixed(2) + " km";
                document.getElementById('txt-ascent').innerText = Math.round(stats.climb) + " m";
                document.getElementById('txt-max').innerText = Math.round(stats.maxEle) + " m";
                document.getElementById('txt-avg').innerText = Math.round(stats.avgEle) + " m";
            }
        }

        // 7. Load File Logic
        document.getElementById('fileInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                elControl.clear();
                elControl.load(evt.target.result);
                // After loading, update the custom text view labels
                elControl.on('eledata_loaded', (data) => {
                    const s = data.track_info;
                    document.getElementById('txt-dist').innerText = (s.distance).toFixed(2) + " km";
                    document.getElementById('txt-time').innerText = s.time;
                    document.getElementById('txt-ascent').innerText = Math.round(s.elevation_gain) + " m";
                    document.getElementById('txt-max').innerText = Math.round(s.elevation_max) + " m";
                });
                setTimeout(() => map.fitBounds(elControl.getBounds()), 500);
            };
            reader.readAsText(e.target.files[0]);
        };

        function saveGPX() {
            let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="BikeNav"><trk><trkseg>`;
            recordedPoints.forEach(p => { gpx += `\n<trkpt lat="${p.lat}" lon="${p.lon}"><ele>${p.ele}</ele><time>${p.time}</time></trkpt>`; });
            gpx += `\n</trkseg></trk></gpx>`;
            const blob = new Blob([gpx], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `ride_${Date.now()}.gpx`; a.click();
        }

        initGPS();
    </script>
</body>
</html>
