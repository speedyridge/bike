<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bike Nav Pro</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.css" />

    <style>
        :root { --bg: #111; --card: #1a1a1a; --accent: #00e676; --blue: #2979ff; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        #map { height: 55vh; width: 100%; background: #222; } 
        #elevation-div { height: 45vh; width: 100%; background: var(--bg); overflow-y: auto; }
        
        /* --- DASHBOARD FORMATTING FIX --- */
        .elevation-summary { 
            display: flex !important;
            flex-wrap: wrap !important;
            padding: 15px !important;
            background: var(--bg) !important;
            border: none !important;
        }

        /* Force each stat (Length, Time, etc.) to be its own block */
        .elevation-summary > span {
            display: flex !important;
            flex-direction: column !important;
            width: 45% !important; /* Forces 2 columns */
            margin: 2% !important;
            padding: 12px !important;
            background: var(--card) !important;
            border-radius: 10px !important;
            border-bottom: 3px solid #333 !important;
            text-align: center !important;
        }

        /* Hide those dashes between the text */
        .elevation-summary .summarydivider { display: none !important; }

        /* Style the Label (e.g. "Total Length") */
        .elevation-summary .summarylabel { 
            font-size: 0.7rem !important; 
            color: #888 !important; 
            text-transform: uppercase !important; 
            margin-bottom: 5px !important;
            order: 1; /* Label on top */
        }

        /* Style the Value (e.g. "12.50 km") */
        .elevation-summary .summaryvalue { 
            font-size: 1.2rem !important; 
            font-weight: bold !important; 
            color: var(--accent) !important;
            order: 2; /* Number below label */
        }
        /* ---------------------------------- */

        #stats {
            position: absolute; top: env(safe-area-inset-top, 10px); left: 10px; z-index: 1000;
            display: flex; gap: 8px; pointer-events: none;
        }
        .stat-card { background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 12px; border-bottom: 3px solid var(--accent); min-width: 60px; text-align: center; }
        .val { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        .lbl { font-size: 0.6rem; text-transform: uppercase; opacity: 0.6; display: block; }

        #controls {
            position: absolute; bottom: 47vh; right: 12px; z-index: 1000;
            display: flex; flex-direction: column; gap: 12px;
        }
        .btn {
            width: 55px; height: 55px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #locateBtn { background: white; color: black; } 
        #startBtn { background: var(--accent); color: black; }
        #stopBtn { background: #ff5252; color: white; display: none; }
        #fileBtn { background: #333; color: white; }
    </style>
</head>
<body>

    <div id="stats">
        <div class="stat-card"><span id="speed" class="val">0.0</span><span class="lbl">km/h</span></div>
        <div class="stat-card"><span id="dist" class="val">0.00</span><span class="lbl">km recorded</span></div>
    </div>

    <div id="controls">
        <label class="btn" id="fileBtn">📂<input type="file" id="fileInput" style="display:none" accept=".gpx"></label>
        <button class="btn" id="locateBtn">🎯</button>
        <button class="btn" id="startBtn">▶️</button>
        <button class="btn" id="stopBtn">⏹️</button>
    </div>

    <div id="map"></div>
    <div id="elevation-div"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-gpx/gpx.js"></script>
    <script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>
    <script src="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.js"></script>

    <script>
        let map, elControl, watchId, userMarker, polyline, recordedPoints = [], totalDist = 0, isRecording = false, lastLatlng = null;

        map = L.map('map', { zoomControl: false, attributionControl: false }).setView([0,0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Elevation setup
        elControl = L.control.elevation({
            container: "#elevation-div",
            theme: "dark-theme",
            detached: true,
            summary: 'multiline', // Vital for the CSS grid to work
            elevationData: "ele"
        }).addTo(map);

        // GPS Logic
        function initGPS() {
            watchId = navigator.geolocation.watchPosition(pos => {
                const { latitude, longitude, altitude, speed } = pos.coords;
                lastLatlng = [latitude, longitude];
                document.getElementById('speed').innerText = (speed * 3.6 || 0).toFixed(1);
                
                if (!userMarker) {
                    userMarker = L.circleMarker(lastLatlng, {radius: 9, color: 'white', fillColor: '#2979ff', fillOpacity: 1, weight: 3}).addTo(map);
                    map.setView(lastLatlng, 16);
                } else { userMarker.setLatLng(lastLatlng); }

                if (isRecording) {
                    if(recordedPoints.length > 0) {
                        const prev = recordedPoints[recordedPoints.length - 1];
                        totalDist += (map.distance([prev.lat, prev.lon], lastLatlng) / 1000);
                        document.getElementById('dist').innerText = totalDist.toFixed(2);
                    }
                    recordedPoints.push({ lat: latitude, lon: longitude, ele: altitude || 0, time: new Date().toISOString() });
                    polyline.addLatLng(lastLatlng);
                }
            }, null, { enableHighAccuracy: true });
        }

        document.getElementById('locateBtn').onclick = () => { if (lastLatlng) map.flyTo(lastLatlng, 16); };
        
        document.getElementById('startBtn').onclick = () => {
            isRecording = true; recordedPoints = []; totalDist = 0;
            if(polyline) map.removeLayer(polyline);
            polyline = L.polyline([], {color: '#00e676', weight: 6}).addTo(map);
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'flex';
        };

        document.getElementById('stopBtn').onclick = () => {
            if (confirm("Stop recording?")) {
                isRecording = false;
                document.getElementById('startBtn').style.display = 'flex';
                document.getElementById('stopBtn').style.display = 'none';
                if(recordedPoints.length > 5 && confirm("Save GPX?")) downloadGPX(recordedPoints);
            }
        };

        function downloadGPX(points) {
            let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="BikeNav"><trk><trkseg>`;
            points.forEach(p => { gpx += `\n<trkpt lat="${p.lat}" lon="${p.lon}"><ele>${p.ele}</ele><time>${p.time}</time></trkpt>`; });
            gpx += `\n</trkseg></trk></gpx>`;
            const blob = new Blob([gpx], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `ride_${Date.now()}.gpx`;
            a.click();
        }

        document.getElementById('fileInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                elControl.clear();
                elControl.load(evt.target.result);
                setTimeout(() => map.fitBounds(elControl.getBounds()), 500);
            };
            reader.readAsText(e.target.files[0]);
        };
        initGPS();
    </script>
</body>
</html>
