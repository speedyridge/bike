<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BikeNav</title>
    
    <!-- PWA Settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#111111">
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJkZXNjcmlwdGlvbiI6ICJCaWtlIE5hdmlnYXRpb24iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJpY29ucyI6IFsgeyAic3JjIjogImh0dHBzOi8vY2RuLWljb25zLXBuZy5mbGF0aWNvbi5jb20vNTEyLzI5NzYvMjk3NjA2OC5wbmciLCAic2l6ZXMiOiAiNTEyeDUxMiIsICJ0eXBlIjogImltYWdlL3BuZyIgfSBdLAogICJuYW1lIjogIkJpa2VOYXYiLAogICJzaG9ydF9uYW1lIjogIkJpa2VOYXYiLAogICJzdGFydF91cmwiOiAiLiIKfQ==">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.css" />

    <style>
        :root { --bg: #111; --card: #1a1a1a; --accent: #00e676; --blue: #2979ff; --error: #ff5252; }
        
        /* THE FIX: Flexbox Layout to remove gaps */
        body, html { 
            margin: 0; padding: 0; 
            height: 100%; width: 100%; 
            background: var(--bg); color: white; 
            font-family: sans-serif; 
            overflow: hidden;
            display: flex;
            flex-direction: column; /* Stack map and display area */
        }
        
        #map { 
            flex: 6; /* Takes 60% of available height */
            width: 100%; 
            background: #222; 
        } 
        
        #display-area { 
            flex: 4; /* Takes 40% of available height */
            width: 100%; 
            background: var(--bg); 
            position: relative; 
            border-top: 1px solid #333;
            /* Account for Samsung navigation bar at the bottom */
            padding-bottom: env(safe-area-inset-bottom); 
        }
        
        /* Ensure the elevation div fills the container perfectly */
        #elevation-div { height: 100%; width: 100%; }

        /* Dashboard Overlay */
        #live-dashboard {
            position: absolute; top: env(safe-area-inset-top, 10px); left: 10px; z-index: 1000;
            display: flex; flex-direction: column; gap: 5px; pointer-events: none;
        }
        .live-card { 
            background: rgba(0,0,0,0.85); padding: 6px 12px; border-radius: 8px; 
            border-left: 4px solid var(--accent); font-size: 0.9rem;
        }
        .live-val { font-weight: bold; color: var(--accent); font-size: 1.1rem; }

        /* Text View Layout */
        #text-summary-view { 
            height: 100%; width: 100%; display: none;
            grid-template-columns: 1fr 1fr; gap: 8px; padding: 15px; box-sizing: border-box;
        }
        .summary-card { background: var(--card); padding: 10px; border-radius: 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; border-bottom: 2px solid #333; }
        .summary-label { font-size: 0.65rem; color: #888; text-transform: uppercase; }
        .summary-value { font-size: 1.2rem; font-weight: bold; color: var(--accent); }

        /* Controls */
        #controls {
            position: absolute; bottom: 15px; right: 10px; z-index: 1000;
            display: flex; flex-direction: column; gap: 10px;
        }
        .btn {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            background: #333; color: white;
        }
        #toggleViewBtn { background: var(--blue); }
        #locateBtn { background: white; color: black; }
        #startBtn { background: var(--accent); color: black; }
        #stopBtn { background: var(--error); display: none; }

        /* Remove default plugin UI elements */
        .elevation-control .close-button { display: none !important; }
        .elevation-summary { display: none !important; }
    </style>
</head>
<body>

    <div id="live-dashboard">
        <div class="live-card"><span id="speed" class="live-val">0.0</span> km/h</div>
        <div class="live-card"><span id="live-dist" class="live-val">0.00</span> km</div>
    </div>

    <div id="map"></div>
    
    <div id="display-area">
        <div id="controls">
            <label class="btn">📂<input type="file" id="fileInput" style="display:none" accept=".gpx"></label>
            <button class="btn" id="toggleViewBtn">📊</button>
            <button class="btn" id="locateBtn">🎯</button>
            <button class="btn" id="startBtn">▶️</button>
            <button class="btn" id="stopBtn">⏹️</button>
        </div>

        <div id="elevation-div"></div>
        <div id="text-summary-view">
            <div class="summary-card"><span class="summary-label">Distance</span><span id="txt-dist" class="summary-value">0.00 km</span></div>
            <div class="summary-card"><span class="summary-label">Climb</span><span id="txt-ascent" class="summary-value">0 m</span></div>
            <div class="summary-card"><span class="summary-label">Max Elev</span><span id="txt-max" class="summary-value">0 m</span></div>
            <div class="summary-card"><span class="summary-label">Avg Elev</span><span id="txt-avg" class="summary-value">0 m</span></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-gpx/gpx.js"></script>
    <script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>
    <script src="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.js"></script>

    <script>
        let map, elControl, userMarker, watchId, polyline, recordedPoints = [];
        let isRecording = false, followMode = true, currentLatlng = null, totalDist = 0;

        // Initialize Map
        map = L.map('map', { zoomControl: false, attributionControl: false }).setView([52.6, -1.6], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        elControl = L.control.elevation({
            container: "#elevation-div",
            theme: "dark-theme",
            detached: true,
            summary: false,
            responsive: true,
            maintainAspectRatio: false
        }).addTo(map);

        // Toggle Graph vs Text
        let graphVisible = true;
        document.getElementById('toggleViewBtn').onclick = () => {
            graphVisible = !graphVisible;
            document.getElementById('elevation-div').style.display = graphVisible ? 'block' : 'none';
            document.getElementById('text-summary-view').style.display = graphVisible ? 'none' : 'grid';
            document.getElementById('toggleViewBtn').innerText = graphVisible ? '📊' : '📝';
        };

        // GPS Logic
        function initGPS() {
            watchId = navigator.geolocation.watchPosition(pos => {
                const { latitude, longitude, altitude, speed } = pos.coords;
                const now = [latitude, longitude];
                
                document.getElementById('speed').innerText = (speed * 3.6 || 0).toFixed(1);

                if (!userMarker) {
                    userMarker = L.circleMarker(now, {radius: 8, color: 'white', fillColor: '#2979ff', fillOpacity: 1, weight: 2}).addTo(map);
                    map.setView(now, 16);
                } else { userMarker.setLatLng(now); }

                if (followMode) map.panTo(now);

                if (isRecording) {
                    if (currentLatlng) {
                        totalDist += (map.distance(currentLatlng, now) / 1000);
                        document.getElementById('live-dist').innerText = totalDist.toFixed(2);
                        document.getElementById('txt-dist').innerText = totalDist.toFixed(2) + " km";
                    }
                    recordedPoints.push({ lat: latitude, lon: longitude, ele: altitude || 0, time: new Date().toISOString() });
                    polyline.addLatLng(now);
                }
                currentLatlng = now;
            }, null, { enableHighAccuracy: true });
        }

        // Auto-Center logic
        document.getElementById('locateBtn').onclick = () => {
            followMode = true;
            document.getElementById('locateBtn').style.background = "var(--blue)";
            document.getElementById('locateBtn').style.color = "white";
            if (currentLatlng) map.flyTo(currentLatlng, 17);
        };
        map.on('dragstart', () => {
            followMode = false;
            document.getElementById('locateBtn').style.background = "white";
            document.getElementById('locateBtn').style.color = "black";
        });

        // Record Buttons
        document.getElementById('startBtn').onclick = () => {
            isRecording = true; recordedPoints = []; totalDist = 0;
            if(polyline) map.removeLayer(polyline);
            polyline = L.polyline([], {color: 'var(--accent)', weight: 5}).addTo(map);
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'flex';
        };

        document.getElementById('stopBtn').onclick = () => {
            if(confirm("Stop ride and save?")) {
                isRecording = false;
                document.getElementById('startBtn').style.display = 'flex';
                document.getElementById('stopBtn').style.display = 'none';
                saveGPX();
            }
        };

        // File Loading
        document.getElementById('fileInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                elControl.clear();
                elControl.load(evt.target.result);
                elControl.on('eledata_loaded', (data) => {
                    const s = data.track_info;
                    document.getElementById('txt-dist').innerText = s.distance.toFixed(2) + " km";
                    document.getElementById('txt-ascent').innerText = Math.round(s.elevation_gain) + " m";
                    document.getElementById('txt-max').innerText = Math.round(s.elevation_max) + " m";
                    document.getElementById('txt-avg').innerText = Math.round(s.elevation_avg) + " m";
                    document.getElementById('live-dist').innerText = s.distance.toFixed(2);
                });
                setTimeout(() => map.fitBounds(elControl.getBounds()), 500);
            };
            reader.readAsText(e.target.files[0]);
        };

        function saveGPX() {
            let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="BikeNav"><trk><trkseg>`;
            recordedPoints.forEach(p => { gpx += `\n<trkpt lat="${p.lat}" lon="${p.lon}"><ele>${p.ele}</ele><time>${p.time}</time></trkpt>`; });
            gpx += `\n</trkseg></trk></gpx>`;
            const blob = new Blob([gpx], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `ride_${Date.now()}.gpx`; a.click();
        }

        initGPS();
    </script>
</body>
</html>
