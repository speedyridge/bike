<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BikeNav Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.css" />

    <style>
        :root { --bg: #0b0e14; --card: #161616; --accent: #00e676; --blue: #2979ff; --error: #ff5252; }
        * { box-sizing: border-box; margin: 0 !important; padding: 0 !important; }
        html, body { height: 100dvh; width: 100%; background: var(--bg); overflow: hidden; position: fixed; }
        
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 60%; background: #1a1a1a; z-index: 1; } 
        #display-area { position: absolute; top: 60%; bottom: 0; left: 0; width: 100%; background: var(--bg); border-top: 1px solid #222; z-index: 2; }
        #elevation-div { height: 100%; width: 100%; background: var(--bg); }

        /* HIDE 'X' BUTTON */
        .elevation-control .close-button, .elevation-control-close, .elevation-toggle, .leaflet-control-elevation .close-button, a.close-button, .elevation-control .elevation-summary { 
            display: none !important; visibility: hidden !important; pointer-events: none !important;
        }

        #live-dashboard {
            position: fixed; top: 10px; left: 10px; z-index: 3000;
            display: flex; flex-direction: column; gap: 6px; pointer-events: none;
        }
        .live-card { background: rgba(0,0,0,0.8); padding: 8px 12px !important; border-radius: 8px; border-left: 4px solid var(--accent); font-family: sans-serif; color: white; }
        .live-val { font-weight: bold; color: var(--accent); font-size: 1.1rem; }

        #controls { position: fixed; top: 15%; right: 12px; z-index: 4000; display: flex; flex-direction: column; gap: 12px; }
        .btn { width: 42px; height: 42px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; background: #222; color: white; }
        #toggleViewBtn { background: var(--blue); }
        #locateBtn { background: #fff; color: #000; }
        #startBtn { background: var(--accent); color: #000; }
        #stopBtn { background: var(--error); color: #fff; display: none; }

        #text-summary-view { height: 100%; width: 100%; display: none; grid-template-columns: 1fr 1fr; gap: 8px; padding: 15px !important; background: var(--bg); }
        .summary-card { background: var(--card); border-radius: 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; border-bottom: 2px solid #333; }
        .summary-label { font-size: 0.65rem; color: #888; text-transform: uppercase; }
        .summary-value { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

    <!-- Hidden Silent Audio for Background GPS -->
    <audio id="silentAudio" loop><source src="data:audio/wav;base64,UklGRiQAAABXQVZFRm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" type="audio/wav"></audio>

    <div id="live-dashboard">
        <div class="live-card"><span id="speed" class="live-val">0.0</span> km/h</div>
        <div class="live-card"><span id="live-dist" class="live-val">0.00</span> km</div>
    </div>

    <div id="controls">
        <label class="btn">📂<input type="file" id="fileInput" style="display:none" accept=".gpx"></label>
        <button class="btn" id="toggleViewBtn">📊</button>
        <button class="btn" id="locateBtn">🎯</button>
        <button class="btn" id="startBtn">▶️</button>
        <button class="btn" id="stopBtn">⏹️</button>
    </div>

    <div id="map"></div>
    <div id="display-area">
        <div id="elevation-div"></div>
        <div id="text-summary-view">
            <div class="summary-card"><span class="summary-label">Distance</span><span id="txt-dist" class="summary-value">0.00 km</span></div>
            <div class="summary-card"><span class="summary-label">Climb</span><span id="txt-ascent" class="summary-value">0 m</span></div>
            <div class="summary-card"><span class="summary-label">Max Elev</span><span id="txt-max" class="summary-value">0 m</span></div>
            <div class="summary-card"><span class="summary-label">Avg Elev</span><span id="txt-avg" class="summary-value">0 m</span></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-gpx/gpx.js"></script>
    <script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>
    <script src="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.js"></script>

    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        let map, elControl, userMarker, watchId, polyline, recordedPoints = [];
        let isRecording = false, followMode = true, currentLatlng = null, totalDist = 0;
        let wakeLock = null;

        map = L.map('map', { zoomControl: false, attributionControl: false }).setView([51.5, -0.1], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        elControl = L.control.elevation({
            container: "#elevation-div", theme: "dark-theme", detached: true,
            summary: false, responsive: true, maintainAspectRatio: false, closeBtn: false
        }).addTo(map);

        const observer = new MutationObserver(() => {
            ['.close-button', '.elevation-control-close', '.elevation-toggle'].forEach(s => {
                const el = document.querySelector(s); if (el) el.remove();
            });
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // WAKE LOCK & AUDIO START (The Background Fix)
        async function startRideShield() {
            try {
                // 1. Keep Screen On
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
                // 2. Play Silent Audio (Keep Browser Alive)
                document.getElementById('silentAudio').play();
            } catch (err) { console.log("Shield Error: " + err); }
        }

        function stopRideShield() {
            if (wakeLock !== null) { wakeLock.release(); wakeLock = null; }
            document.getElementById('silentAudio').pause();
        }

        document.getElementById('startBtn').onclick = () => {
            isRecording = true; recordedPoints = []; totalDist = 0;
            if(polyline) map.removeLayer(polyline);
            polyline = L.polyline([], {color: 'var(--accent)', weight: 5}).addTo(map);
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'flex';
            startRideShield(); // ACTIVATE SHIELD
        };

        document.getElementById('stopBtn').onclick = () => {
            if(confirm("Save ride?")) {
                isRecording = false;
                document.getElementById('startBtn').style.display = 'flex';
                document.getElementById('stopBtn').style.display = 'none';
                stopRideShield(); // DISABLE SHIELD
                saveGPX();
            }
        };

        // Standard logic remains below...
        document.getElementById('toggleViewBtn').onclick = () => {
            const g = document.getElementById('elevation-div'), t = document.getElementById('text-summary-view');
            const isG = g.style.display !== 'none';
            g.style.display = isG ? 'none' : 'block';
            t.style.display = isG ? 'grid' : 'none';
        };

        function initGPS() {
            watchId = navigator.geolocation.watchPosition(pos => {
                const { latitude, longitude, altitude, speed } = pos.coords;
                const now = [latitude, longitude];
                document.getElementById('speed').innerText = (speed * 3.6 || 0).toFixed(1);
                if (!userMarker) {
                    userMarker = L.circleMarker(now, {radius: 8, color: 'white', fillColor: '#2979ff', fillOpacity: 1, weight: 2}).addTo(map);
                    map.setView(now, 17);
                } else { userMarker.setLatLng(now); }
                if (followMode) map.panTo(now);
                if (isRecording) {
                    if (currentLatlng) {
                        totalDist += (map.distance(currentLatlng, now) / 1000);
                        document.getElementById('live-dist').innerText = totalDist.toFixed(2);
                        document.getElementById('txt-dist').innerText = totalDist.toFixed(2) + " km";
                    }
                    recordedPoints.push({ lat: latitude, lon: longitude, ele: altitude || 0, time: new Date().toISOString() });
                    polyline.addLatLng(now);
                }
                currentLatlng = now;
            }, null, { enableHighAccuracy: true });
        }

        document.getElementById('locateBtn').onclick = () => {
            followMode = true; document.getElementById('locateBtn').style.background = "var(--blue)";
            document.getElementById('locateBtn').style.color = "white";
            if (currentLatlng) map.flyTo(currentLatlng, 17);
        };
        map.on('dragstart', () => {
            followMode = false; document.getElementById('locateBtn').style.background = "white";
            document.getElementById('locateBtn').style.color = "black";
        });

        document.getElementById('fileInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                elControl.clear(); elControl.load(evt.target.result);
                elControl.on('eledata_loaded', (data) => {
                    const s = data.track_info;
                    document.getElementById('txt-dist').innerText = s.distance.toFixed(2) + " km";
                    document.getElementById('txt-ascent').innerText = Math.round(s.elevation_gain) + " m";
                    document.getElementById('txt-max').innerText = Math.round(s.elevation_max) + " m";
                    document.getElementById('txt-avg').innerText = Math.round(s.elevation_avg) + " m";
                });
                setTimeout(() => map.fitBounds(elControl.getBounds()), 500);
            };
            reader.readAsText(e.target.files[0]);
        };

        function saveGPX() {
            let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1"><trk><trkseg>`;
            recordedPoints.forEach(p => { gpx += `\n<trkpt lat="${p.lat}" lon="${p.lon}"><ele>${p.ele}</ele><time>${p.time}</time></trkpt>`; });
            gpx += `\n</trkseg></trk></gpx>`;
            const blob = new Blob([gpx], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `ride_${Date.now()}.gpx`; a.click();
        }

        initGPS();
    </script>
</body>
</html>
