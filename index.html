<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bike Nav Pro</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.css" />

    <style>
        :root { --bg: #121212; --accent: #00e676; --error: #ff5252; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
        
        #map { height: 65vh; width: 100%; background: #222; } 
        #elevation-div { height: 35vh; width: 100%; background: #1a1a1a; }
        
        /* Dashboard */
        #stats {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        }
        .stat-card { background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 8px; border-left: 3px solid var(--accent); }
        .val { font-size: 1.1rem; font-weight: bold; display: block; color: var(--accent); }
        .lbl { font-size: 0.6rem; text-transform: uppercase; opacity: 0.7; }

        /* Controls */
        #controls {
            position: absolute; bottom: 37vh; right: 10px; z-index: 1000;
            display: flex; flex-direction: column; gap: 12px;
        }
        .btn {
            width: 55px; height: 55px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #startBtn { background: var(--accent); color: black; }
        #stopBtn { background: var(--error); color: white; display: none; }
        #fileBtn { background: #333; color: white; }

        .recording-pulse {
            position: absolute; top: 10px; right: 10px; width: 12px; height: 12px;
            background: red; border-radius: 50%; display: none;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="stats">
        <div class="stat-card"><span id="speed" class="val">0.0</span><span class="lbl">km/h</span></div>
        <div class="stat-card"><span id="dist" class="val">0.00</span><span class="lbl">Distance</span></div>
    </div>

    <div id="recordingIndicator" class="recording-pulse"></div>

    <div id="controls">
        <label class="btn" id="fileBtn">📂<input type="file" id="fileInput" style="display:none" accept=".gpx"></label>
        <button class="btn" id="startBtn">▶️</button>
        <button class="btn" id="stopBtn">⏹️</button>
    </div>

    <div id="map"></div>
    <div id="elevation-div"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-gpx/gpx.js"></script>
    <script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>
    <script src="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.js"></script>

    <script>
        let map, elControl, watchId, userMarker, polyline;
        let recordedPoints = []; // Stores: {lat, lon, alt, time}
        let totalDist = 0;
        let isRecording = false;

        // Initialize Map
        map = L.map('map', { zoomControl: false }).setView([0,0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        elControl = L.control.elevation({
            container: "#elevation-div",
            theme: "dark-theme",
            detached: true,
        }).addTo(map);

        // UI Elements
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const recInd = document.getElementById('recordingIndicator');

        // Start Recording
        startBtn.onclick = () => {
            isRecording = true;
            recordedPoints = [];
            totalDist = 0;
            
            if(polyline) map.removeLayer(polyline);
            polyline = L.polyline([], {color: '#00e676', weight: 5}).addTo(map);
            
            startBtn.style.display = 'none';
            stopBtn.style.display = 'flex';
            recInd.style.display = 'block';

            startTracking();
        };

        // Stop Recording & Save
        stopBtn.onclick = () => {
            isRecording = false;
            navigator.geolocation.clearWatch(watchId);
            
            startBtn.style.display = 'flex';
            stopBtn.style.display = 'none';
            recInd.style.display = 'none';

            if(recordedPoints.length > 0) {
                downloadGPX(recordedPoints);
            }
        };

        function startTracking() {
            watchId = navigator.geolocation.watchPosition(pos => {
                const { latitude, longitude, altitude, speed } = pos.coords;
                const now = new Array(latitude, longitude);
                
                // Update UI
                document.getElementById('speed').innerText = (speed * 3.6 || 0).toFixed(1);
                
                if (!userMarker) {
                    userMarker = L.circleMarker(now, {radius: 8, color: 'white', fillColor: '#007bff', fillOpacity: 1}).addTo(map);
                } else {
                    userMarker.setLatLng(now);
                }
                map.panTo(now);

                if (isRecording) {
                    const point = { lat: latitude, lon: longitude, ele: altitude || 0, time: new Date().toISOString() };
                    
                    // Distance calculation
                    if(recordedPoints.length > 0) {
                        const prev = recordedPoints[recordedPoints.length - 1];
                        const d = map.distance([prev.lat, prev.lon], [point.lat, point.lon]);
                        totalDist += (d / 1000);
                        document.getElementById('dist').innerText = totalDist.toFixed(2);
                    }

                    recordedPoints.push(point);
                    polyline.addLatLng(now);
                }
            }, err => console.error(err), { enableHighAccuracy: true });
        }

        // Export data to GPX file
        function downloadGPX(points) {
            let gpxContent = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="BikeNavApp" xmlns="http://www.topografix.com/GPX/1/1">
  <trk><name>My Ride</name><trkseg>`;
            
            points.forEach(p => {
                gpxContent += `\n    <trkpt lat="${p.lat}" lon="${p.lon}"><ele>${p.ele}</ele><time>${p.time}</time></trkpt>`;
            });

            gpxContent += `\n  </trkseg></trk></gpx>`;

            const blob = new Blob([gpxContent], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ride_${new Date().getTime()}.gpx`;
            a.click();
        }

        // File Loader (Existing Route)
        document.getElementById('fileInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                elControl.clear();
                elControl.load(evt.target.result);
                setTimeout(() => map.fitBounds(elControl.getBounds()), 500);
            };
            reader.readAsText(e.target.files[0]);
        };
    </script>
</body>
</html>
